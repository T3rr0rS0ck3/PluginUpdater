name: Build, Test, and Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

env:
  version: ${{ github.ref_name }}


jobs:
  build_and_release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set version in version.info
      run: |
        $content = Get-Content version.info
        $content = $content -replace '(?<=PluginUpdater:)[0-9\.]+', "${{ env.version }}"
        Set-Content version.info $content

    - name: Commit and push updated version.info
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git pull origin main || echo "No changes to pull"
        git add version.info
        git commit -m "Set version in version.info to ${{ env.version }}" || echo "No changes to commit"
        git push origin HEAD:main

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1

    - name: Download KeePass portable package
      shell: pwsh
      run: |
        $keepassVersion = '2.58'
        $keepassZip = Join-Path $env:RUNNER_TEMP "KeePass-$keepassVersion.zip"
        $keepassDir = Join-Path $env:RUNNER_TEMP "KeePass-$keepassVersion"
        $keepassUrl = "https://sourceforge.net/projects/keepass/files/KeePass%202.x/$keepassVersion/KeePass-$keepassVersion.zip/download"

        curl.exe -L --fail --retry 3 --retry-delay 2 -o $keepassZip $keepassUrl

        $fileInfo = Get-Item $keepassZip -ErrorAction Stop
        if ($fileInfo.Length -lt 1000000) {
          throw "Downloaded KeePass archive looks invalid: $($fileInfo.Length) bytes."
        }

        Expand-Archive -Path $keepassZip -DestinationPath $keepassDir -Force

        New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'dlls') | Out-Null
        Copy-Item -Path (Join-Path $keepassDir 'KeePass.exe') -Destination (Join-Path $env:GITHUB_WORKSPACE 'dlls\KeePass.exe') -Force

    - name: Restore NuGet packages
      run: nuget restore PluginUpdater.sln

    - name: Set version in AssemblyInfo
      shell: pwsh
      run: |
        $asmInfo = Get-ChildItem -Path . -Recurse -Filter AssemblyInfo.cs | Select-Object -First 1
        (Get-Content $asmInfo.FullName) -replace '(?<=AssemblyVersion\(")[^"]+', "${{ env.version }}" | Set-Content $asmInfo.FullName
        (Get-Content $asmInfo.FullName) -replace '(?<=AssemblyFileVersion\(")[^"]+', "${{ env.version }}" | Set-Content $asmInfo.FullName

    - name: Build solution with version
      run: |
        msbuild PluginUpdater.sln /p:Configuration=Release /p:AssemblyVersion=${{ env.version }} /p:FileVersion=${{ env.version }}

    - name: Clean plugin source output folders
      shell: pwsh
      run: |
        Remove-Item -Recurse -Force (Join-Path $env:GITHUB_WORKSPACE 'PluginUpdater\bin') -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force (Join-Path $env:GITHUB_WORKSPACE 'PluginUpdater\obj') -ErrorAction SilentlyContinue

    - name: Create PLGX package
      shell: pwsh
      run: |
        $keepassExe = Join-Path $env:GITHUB_WORKSPACE 'dlls\KeePass.exe'
        $pluginSourceDir = Join-Path $env:GITHUB_WORKSPACE 'PluginUpdater'
        $plgxLog = Join-Path $env:GITHUB_WORKSPACE 'plgx-build.log'

        & $keepassExe --debug --plgx-create $pluginSourceDir --plgx-prereq-kp:2.58 --plgx-prereq-net:4.8 2>&1 | Tee-Object -FilePath $plgxLog

        if ($LASTEXITCODE -ne 0) {
          throw "KeePass PLGX build failed with exit code $LASTEXITCODE. See $plgxLog for details."
        }

        $plgx = Get-ChildItem -Path $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP -Recurse -Filter *.plgx -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if (-not $plgx) {
          if (Test-Path $plgxLog) {
            Write-Host '--- KeePass PLGX build log ---'
            Get-Content $plgxLog | ForEach-Object { Write-Host $_ }
            Write-Host '--- End KeePass PLGX build log ---'
          }
          throw 'PLGX file was not created.'
        }

        New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'release') | Out-Null
        Copy-Item -Path $plgx.FullName -Destination (Join-Path $env:GITHUB_WORKSPACE 'release\PluginUpdater.plgx') -Force

    - name: Generate release notes
      shell: pwsh
      run: |
        git fetch --tags --force

        $currentTag = "${{ env.version }}"
        $tags = git tag --sort=-creatordate
        $previousTag = $tags | Where-Object { $_ -ne $currentTag } | Select-Object -First 1

        $releaseNotes = New-Object System.Text.StringBuilder
        [void]$releaseNotes.AppendLine("## PluginUpdater $currentTag")
        [void]$releaseNotes.AppendLine("")

        if ($previousTag) {
          [void]$releaseNotes.AppendLine("Changes since $previousTag:")
          [void]$releaseNotes.AppendLine("")
          $commits = git log "$previousTag..HEAD" --pretty=format:"- %s (%h)"
        }
        else {
          [void]$releaseNotes.AppendLine("Changes:")
          [void]$releaseNotes.AppendLine("")
          $commits = git log --pretty=format:"- %s (%h)"
        }

        if (-not $commits) {
          [void]$releaseNotes.AppendLine("- No changes recorded.")
        }
        else {
          $commits | ForEach-Object { [void]$releaseNotes.AppendLine($_) }
        }

        $releaseNotesPath = Join-Path $env:GITHUB_WORKSPACE 'release-notes.md'
        Set-Content -Path $releaseNotesPath -Value $releaseNotes.ToString() -Encoding utf8

    - name: Create GitHub Release and Upload artifact
      uses: softprops/action-gh-release@v1
      with:
        files: release/PluginUpdater.plgx
        body_path: release-notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}